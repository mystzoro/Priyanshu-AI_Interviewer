<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AI Interview Agent — AI Cohort</title>
<style>
  :root {
    --bg: #0b0e14; --panel: #131722; --panel2: #1a1f2e; --border: #262c3d;
    --text: #e6e9f0; --muted: #8891a7; --accent: #6c8cff; --accent2: #7ee0c0;
    --warn: #f5b942; --bad: #ff6b6b;
  }
  * { box-sizing: border-box; }
  body { margin:0; background: var(--bg); color: var(--text); font: 15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; height:100vh; display:flex; flex-direction:column; }
  header { padding: 16px 24px; border-bottom: 1px solid var(--border); display:flex; align-items:center; justify-content:space-between; }
  header h1 { font-size: 16px; margin:0; font-weight:600; }
  header .sub { color: var(--muted); font-size:12px; margin-top:2px; }
  .layout { flex:1; display:flex; overflow:hidden; }
  .side { width: 280px; border-right:1px solid var(--border); padding:20px; overflow-y:auto; background:var(--panel); }
  .side label { display:block; font-size:12px; color:var(--muted); margin-bottom:6px; text-transform:uppercase; letter-spacing:.04em; }
  select, textarea, button, input { font: inherit; }
  select { width:100%; padding:10px; background:var(--panel2); color:var(--text); border:1px solid var(--border); border-radius:8px; margin-bottom:16px; }
  .candidate-card { background:var(--panel2); border:1px solid var(--border); border-radius:10px; padding:12px; font-size:13px; color:var(--muted); margin-bottom:16px; display:none; }
  .candidate-card.show { display:block; }
  .candidate-card b { color: var(--text); }
  button.primary { width:100%; padding:12px; background:var(--accent); color:#0b0e14; font-weight:600; border:none; border-radius:8px; cursor:pointer; }
  button.primary:disabled { opacity:.4; cursor:not-allowed; }
  button.primary:hover:not(:disabled) { filter:brightness(1.08); }
  .progress { margin-top:18px; font-size:12px; color:var(--muted); }
  .progress .bar { height:6px; background:var(--panel2); border-radius:3px; overflow:hidden; margin-top:6px; }
  .progress .fill { height:100%; background:linear-gradient(90deg,var(--accent),var(--accent2)); width:0%; transition:width .3s; }
  main { flex:1; display:flex; flex-direction:column; }
  .chat { flex:1; overflow-y:auto; padding:24px; display:flex; flex-direction:column; gap:14px; }
  .msg { max-width:70%; padding:12px 16px; border-radius:14px; font-size:14px; white-space:pre-wrap; }
  .msg.interviewer { align-self:flex-start; background:var(--panel2); border:1px solid var(--border); border-bottom-left-radius:4px; }
  .msg.candidate { align-self:flex-end; background:var(--accent); color:#0b0e14; border-bottom-right-radius:4px; }
  .msg .role { display:block; font-size:11px; color:var(--muted); margin-bottom:4px; text-transform:uppercase; letter-spacing:.05em; }
  .msg.candidate .role { color:#0b0e14aa; }
  .typing { align-self:flex-start; color:var(--muted); font-size:13px; padding:0 4px; }
  .composer { border-top:1px solid var(--border); padding:16px 24px; display:flex; gap:10px; background:var(--panel); }
  .composer textarea { flex:1; resize:none; background:var(--panel2); color:var(--text); border:1px solid var(--border); border-radius:10px; padding:12px; min-height:48px; max-height:140px; }
  .composer button { padding:0 22px; background:var(--accent); color:#0b0e14; border:none; border-radius:10px; font-weight:600; cursor:pointer; }
  .composer button:disabled { opacity:.4; cursor:not-allowed; }
  .feedback { align-self:stretch; max-width:none; background:var(--panel2); border:1px solid var(--border); border-radius:14px; padding:20px; }
  .feedback h3 { margin:0 0 8px; font-size:15px; }
  .feedback p.summary { color:var(--muted); margin:0 0 16px; }
  .feedback .section { margin-bottom:14px; }
  .feedback .section h4 { margin:0 0 8px; font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); }
  .feedback ul { margin:0; padding-left:18px; }
  .feedback .strengths h4 { color: var(--accent2); }
  .feedback .gaps h4 { color: var(--warn); }
  .feedback .next h4 { color: var(--accent); }
  .empty { color:var(--muted); text-align:center; margin-top:80px; font-size:14px; }
  .badge { display:inline-block; font-size:11px; padding:2px 8px; border-radius:20px; background:var(--panel2); border:1px solid var(--border); color:var(--muted); }
</style>
</head>
<body>
<header>
  <div>
    <h1>AI Interview Agent</h1>
    <div class="sub">Adaptive technical interviews for AI Cohort candidates</div>
  </div>
  <span class="badge" id="llmBadge">checking backend…</span>
  <span class="badge" id="breethBadge" style="display:none">⚪️ Breeth memory</span>
</header>
<div class="layout">
  <aside class="side">
    <label for="candidateSelect">Candidate</label>
    <select id="candidateSelect"></select>
    <div class="candidate-card" id="candidateCard"></div>
    <button class="primary" id="startBtn">Start Interview</button>
    <div class="progress" id="progress" style="display:none">
      <span id="progressLabel">0 questions · 0 topics covered</span>
      <div class="bar"><div class="fill" id="progressFill"></div></div>
    </div>
  </aside>
  <main>
    <div class="chat" id="chat">
      <div class="empty">Pick a candidate and start the interview to begin.</div>
    </div>
    <div class="composer">
      <textarea id="input" placeholder="Type the candidate's answer…" disabled></textarea>
      <button id="sendBtn" disabled>Send</button>
    </div>
  </main>
</div>

<script>
const chatEl = document.getElementById('chat');
const selectEl = document.getElementById('candidateSelect');
const cardEl = document.getElementById('candidateCard');
const startBtn = document.getElementById('startBtn');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
const progressEl = document.getElementById('progress');
const progressLabel = document.getElementById('progressLabel');
const progressFill = document.getElementById('progressFill');
const llmBadge = document.getElementById('llmBadge');

let sessionId = null;
let candidatesById = {};
let done = false;
let qCount = 0;

async function init() {
  try {
    const health = await fetch('/api/health').then(r => r.json());
    llmBadge.textContent = health.llmEnabled ? 'Claude-powered' : 'Fallback mode (no API key)';
    if (health.breethEnabled) {
      const bb = document.getElementById('breethBadge');
      bb.style.display = 'inline-block';
      bb.style.color = '#7ee0c0';
      bb.style.borderColor = '#7ee0c0';
    }
  } catch { llmBadge.textContent = 'backend unreachable'; }

  const list = await fetch('/api/candidates').then(r => r.json());
  selectEl.innerHTML = list.map(c => `<option value="${c.id}">${c.name} — ${c.jobRole}</option>`).join('');
  list.forEach(c => candidatesById[c.id] = c);
  renderCard(list[0]);
  selectEl.onchange = () => renderCard(candidatesById[selectEl.value]);
}

function renderCard(c) {
  if (!c) return;
  cardEl.className = 'candidate-card show';
  cardEl.innerHTML = `<b>${c.name}</b><br>${c.jobRole} · ${c.yearsExperience} yrs experience`;
}

function addMessage(role, text) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.innerHTML = `<span class="role">${role === 'interviewer' ? 'Aiden · Interviewer' : 'Candidate'}</span>${escapeHtml(text)}`;
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function showTyping(show) {
  let el = document.getElementById('typingIndicator');
  if (show && !el) {
    el = document.createElement('div');
    el.id = 'typingIndicator';
    el.className = 'typing';
    el.textContent = 'Aiden is thinking…';
    chatEl.appendChild(el);
    chatEl.scrollTop = chatEl.scrollHeight;
  } else if (!show && el) {
    el.remove();
  }
}

function updateProgress() {
  progressEl.style.display = 'block';
  const pct = Math.min(100, (qCount / 8) * 100);
  progressFill.style.width = pct + '%';
  progressLabel.textContent = `${qCount} question${qCount === 1 ? '' : 's'} asked so far`;
}

function renderFeedback(fb) {
  const div = document.createElement('div');
  div.className = 'msg feedback';
  div.innerHTML = `
    <h3>Interview Feedback</h3>
    <p class="summary">${escapeHtml(fb.summary || '')}</p>
    <div class="section strengths"><h4>Strengths</h4><ul>${(fb.strengths||[]).map(s => `<li>${escapeHtml(s)}</li>`).join('') || '<li>—</li>'}</ul></div>
    <div class="section gaps"><h4>Gaps</h4><ul>${(fb.gaps||[]).map(s => `<li>${escapeHtml(s)}</li>`).join('') || '<li>None identified</li>'}</ul></div>
    <div class="section next"><h4>Recommended Next Steps</h4><ul>${(fb.next||[]).map(s => `<li>${escapeHtml(s)}</li>`).join('') || '<li>—</li>'}</ul></div>
  `;
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
}

async function startInterview() {
  const candidate = candidatesById[selectEl.value];
  const full = await fetch('/api/candidates/' + candidate.id).then(r => r.json());
  sessionId = 'web-' + Date.now() + '-' + Math.random().toString(36).slice(2, 8);
  chatEl.innerHTML = '';
  done = false; qCount = 0;
  startBtn.disabled = true;
  showTyping(true);
  const res = await fetch('/api/interview', {
    method: 'POST', headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ sessionId, candidate: full }),
  }).then(r => r.json());
  showTyping(false);
  addMessage('interviewer', res.reply);
  qCount = 1;
  updateProgress();
  inputEl.disabled = false; sendBtn.disabled = false; inputEl.focus();
}

async function sendAnswer() {
  const text = inputEl.value.trim();
  if (!text || done) return;
  addMessage('candidate', text);
  inputEl.value = '';
  sendBtn.disabled = true; inputEl.disabled = true;
  showTyping(true);
  const res = await fetch('/api/interview', {
    method: 'POST', headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ sessionId, message: text }),
  }).then(r => r.json());
  showTyping(false);
  addMessage('interviewer', res.reply);
  qCount++;
  updateProgress();
  if (res.done) {
    done = true;
    if (res.feedback) renderFeedback(res.feedback);
    startBtn.disabled = false;
    inputEl.disabled = true; sendBtn.disabled = true;
  } else {
    inputEl.disabled = false; sendBtn.disabled = false; inputEl.focus();
  }
}

startBtn.addEventListener('click', startInterview);
sendBtn.addEventListener('click', sendAnswer);
inputEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendAnswer(); }
});

init();
</script>
</body>
</html>
